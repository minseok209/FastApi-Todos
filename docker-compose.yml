services:
  fastapi-app:
    build:
      context: ./fastapi-app
      dockerfile: Dockerfile

    # 기본값은 개인 서버용 FastApi-app.
    # 팀 서버에서는 Jenkins가 CONTAINER_NAME을 별도로 전달한다.
    container_name: ${CONTAINER_NAME:-FastApi-app}

    # 기본값은 5001.
    # 필요하면 Jenkins에서 HOST_PORT를 별도로 전달할 수 있다.
    ports:
      - "${HOST_PORT:-5001}:8000"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  # 6주차: 정적 분석 서버 (개인 서버 163.239.77.83:9000)
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:                                    # 분석 이력·토큰·웹훅이 컨테이너를 다시 만들어도 남도록 볼륨에 저장
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # /tmp는 쓰기 가능하게
      - /tmp
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
