services:
  fastapi-app:
    build:
      context: ./fastapi-app
      dockerfile: Dockerfile

    # 기본값은 개인 서버용 FastApi-app.
    # 팀 서버에서는 Jenkins가 CONTAINER_NAME을 별도로 전달한다.
    container_name: ${CONTAINER_NAME:-FastApi-app}

    # 기본값은 5001.
    # 필요하면 Jenkins에서 HOST_PORT를 별도로 전달할 수 있다.
    ports:
      - "${HOST_PORT:-5001}:8000"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  # 6주차: 정적 분석 서버 (개인 서버 163.239.77.83:9000)
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:                                    # 분석 이력·토큰·웹훅이 컨테이너를 다시 만들어도 남도록 볼륨에 저장
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # /tmp는 쓰기 가능하게
      - /tmp
    restart: unless-stopped

  # 7주차: 모니터링 — Prometheus(수집) + Grafana(시각화) + node-exporter(서버) + cAdvisor(컨테이너)
  prometheus:
    image: prom/prometheus:v3.15.0              # latest 대신 버전 고정
    container_name: prometheus
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (데이터 볼륨만 쓰기 가능)
    security_opt:
      - no-new-privileges:true                  # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                                     # 불필요한 커널 권한 모두 제거
    ports:
      - "127.0.0.1:7070:9090"                   # 서버 자신에게만 공개 (Prometheus는 로그인 기능이 없음)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # 설정 파일은 읽기 전용(:ro)
      - prometheus-data:/prometheus             # 수집한 메트릭 저장 (컨테이너를 다시 만들어도 유지)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4               # latest 대신 버전 고정 (2026-10-13 보안 패치 버전)
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_BASIC_PASSWORD_POLICY=true      # 비밀번호 12자 이상 + 대·소문자·숫자·특수문자 필수
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # Prometheus 데이터 소스 + 대시보드 자동 등록
      - ./grafana/dashboards:/etc/grafana/dashboards:ro       # "FastApi-Todos 모니터링" 대시보드 JSON
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1           # latest 대신 버전 고정
    container_name: node-exporter
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ports 없음: Prometheus가 내부 네트워크(node-exporter:9100)로 수집하므로 외부 공개 불필요
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6      # 버전 고정 (v0.53.0부터 ghcr.io — gcr.io/cadvisor/cadvisor는 구버전)
    container_name: cadvisor
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - "--docker_only=true"                    # 서버의 다른 프로세스는 빼고 도커 컨테이너만 수집
      - "--housekeeping_interval=15s"           # Prometheus 수집 주기(15s)에 맞춰 서버 부하를 줄임
    volumes:                                    # 컨테이너 정보를 읽기 위한 호스트 경로 (모두 읽기 전용)
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    tmpfs:
      - /tmp
    # ports 없음: 공식 예제의 8080:8080은 Jenkins(8080)와 겹치고, cAdvisor 화면에는 로그인 기능이 없음
    #            → Prometheus가 내부 네트워크(cadvisor:8080)로만 수집
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  prometheus-data:                              # 7주차
  grafana-data:                                 # 7주차
