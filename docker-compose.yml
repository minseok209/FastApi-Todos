services:
  fastapi-app:
    build:
      context: ./fastapi-app
      dockerfile: Dockerfile

    # 기본값은 개인 서버용 FastApi-app.
    # 팀 서버에서는 Jenkins가 CONTAINER_NAME을 별도로 전달한다.
    container_name: ${CONTAINER_NAME:-FastApi-app}

    # 기본값은 5001.
    # 필요하면 Jenkins에서 HOST_PORT를 별도로 전달할 수 있다.
    ports:
      - "${HOST_PORT:-5001}:8000"

    restart: unless-stopped
    networks:
      - loadtest-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  # 6주차: 정적 분석 서버 (개인 서버 163.239.77.83:9000)
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:                                    # 분석 이력·토큰·웹훅이 컨테이너를 다시 만들어도 남도록 볼륨에 저장
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # /tmp는 쓰기 가능하게
      - /tmp
    restart: unless-stopped
    networks:
      - loadtest-net

  # 7주차: 모니터링 — Prometheus(수집) + Grafana(시각화) + node-exporter(서버) + cAdvisor(컨테이너)
  prometheus:
    image: prom/prometheus:v3.15.0              # latest 대신 버전 고정
    container_name: prometheus
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (데이터 볼륨만 쓰기 가능)
    security_opt:
      - no-new-privileges:true                  # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                                     # 불필요한 커널 권한 모두 제거
    ports:
      - "127.0.0.1:7070:9090"                   # 서버 자신에게만 공개 (Prometheus는 로그인 기능이 없음)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # 설정 파일은 읽기 전용(:ro)
      - prometheus-data:/prometheus             # 수집한 메트릭 저장 (컨테이너를 다시 만들어도 유지)
    restart: unless-stopped
    networks:
      - loadtest-net

  grafana:
    image: grafana/grafana:13.2.4               # latest 대신 버전 고정 (2026-10-13 보안 패치 버전)
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_BASIC_PASSWORD_POLICY=true      # 비밀번호 12자 이상 + 대·소문자·숫자·특수문자 필수
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # Prometheus 데이터 소스 + 대시보드 자동 등록
      - ./grafana/dashboards:/etc/grafana/dashboards:ro       # "FastApi-Todos 모니터링" 대시보드 JSON
    restart: unless-stopped
    networks:
      - loadtest-net

  node-exporter:
    image: prom/node-exporter:v1.12.1           # latest 대신 버전 고정
    container_name: node-exporter
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ports 없음: Prometheus가 내부 네트워크(node-exporter:9100)로 수집하므로 외부 공개 불필요
    restart: unless-stopped
    networks:
      - loadtest-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6      # 버전 고정 (v0.53.0부터 ghcr.io — gcr.io/cadvisor/cadvisor는 구버전)
    container_name: cadvisor
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - "--docker_only=true"                    # 서버의 다른 프로세스는 빼고 도커 컨테이너만 수집
      - "--housekeeping_interval=15s"           # Prometheus 수집 주기(15s)에 맞춰 서버 부하를 줄임
    volumes:                                    # 컨테이너 정보를 읽기 위한 호스트 경로 (모두 읽기 전용)
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    tmpfs:
      - /tmp
    # ports 없음: 공식 예제의 8080:8080은 Jenkins(8080)와 겹치고, cAdvisor 화면에는 로그인 기능이 없음
    #            → Prometheus가 내부 네트워크(cadvisor:8080)로만 수집
    restart: unless-stopped
    networks:
      - loadtest-net

  # 10주차: JMeter 결과 저장소 — JMeter Backend Listener 가 5초마다 결과를 보내고 Grafana 가 읽는다
  influxdb:
    image: influxdb:1.12.4                      # JMeter 기본 InfluxdbBackendListenerClient 가 쓰는 1.x(InfluxQL), 버전 고정
    container_name: influxdb
    security_opt:
      - no-new-privileges:true
    environment:
      - INFLUXDB_DB=jmeter                      # 처음 시작할 때 jmeter 데이터베이스 자동 생성
      - INFLUXDB_REPORTING_DISABLED=true        # InfluxData 로 사용 통계 전송 끄기
      - INFLUXDB_DATA_QUERY_LOG_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb         # 테스트 결과 보존 (컨테이너를 다시 만들어도 유지)
    # ports 없음: InfluxDB 1.x 는 기본 인증이 꺼져 있다 → 외부에 열지 않고
    #            같은 네트워크의 JMeter(쓰기)와 Grafana(읽기)만 influxdb:8086 으로 접속
    restart: unless-stopped
    networks:
      - loadtest-net

  # 10주차: 부하 테스트 실행기 — 평소 `docker compose up -d` 에는 포함되지 않는다 (profiles)
  #   실행: docker compose --profile loadtest run --rm jmeter
  #   부하 조절: THREADS=30 LOOPS=50 docker compose --profile loadtest run --rm jmeter
  jmeter:
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    image: my-jmeter:5.6.3
    container_name: jmeter
    profiles: ["loadtest"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - fastapi-app
      - influxdb
    environment:
      - THREADS=${THREADS:-20}                  # 동시 사용자 수
      - RAMP_UP=${RAMP_UP:-20}                  # 사용자를 모두 띄우는 데 걸리는 시간(초)
      - LOOPS=${LOOPS:-30}                      # 사용자 1명이 시나리오(요청 9개)를 반복하는 횟수
    volumes:
      # 테스트 계획만 읽기 전용으로 넣는다 — 폴더 전체를 마운트하면 컨테이너의 jmeter 계정(uid 1000)이
      # 서버 계정 소유 폴더에 결과를 못 써서 실패한다. 결과·리포트는 컨테이너 안 /jmeter/out 에 만든다.
      - ./jmeter/fastapi_test_plan.jmx:/jmeter/fastapi_test_plan.jmx:ro
    command:
      - sh
      - -c
      - >-
        rm -rf out && mkdir out &&
        jmeter -n -t fastapi_test_plan.jmx -l out/results.jtl -j out/jmeter.log
        -JTARGET_HOST=fastapi-app -JTARGET_PORT=8000
        -JTHREADS=$${THREADS} -JRAMP_UP=$${RAMP_UP} -JLOOPS=$${LOOPS}
        '-JINFLUX_URL=http://influxdb:8086/write?db=jmeter' -JAPP_NAME=compose-fastapi-app
        -Jjmeter.save.saveservice.output_format=csv
        -e -o out/report
    networks:
      - loadtest-net

# 10주차: 모든 서비스를 하나의 네트워크로 — 이름을 고정해 두어야
#         Jenkins 가 띄우는 JMeter 컨테이너도 --network loadtest-net 으로 InfluxDB 에 결과를 보낼 수 있다
networks:
  loadtest-net:
    name: loadtest-net
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  prometheus-data:                              # 7주차
  grafana-data:                                 # 7주차
  influxdb-data:                                # 10주차
