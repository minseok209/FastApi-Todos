services:
  fastapi-app:
    build:
      context: ./fastapi-app
      dockerfile: Dockerfile

    # 기본값은 개인 서버용 FastApi-app.
    # 팀 서버에서는 Jenkins가 CONTAINER_NAME을 별도로 전달한다.
    container_name: ${CONTAINER_NAME:-FastApi-app}

    # 기본값은 5001.
    # 필요하면 Jenkins에서 HOST_PORT를 별도로 전달할 수 있다.
    ports:
      - "${HOST_PORT:-5001}:8000"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
