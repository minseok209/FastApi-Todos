<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        input[type="text"] { flex: 1 1 12rem; padding: .5rem; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #e5e5e5; }
        li span { flex: 1; }
        .done { text-decoration: line-through; color: #888; }
        #error { color: #b00020; }
        #filters { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; }
        #filters button[aria-pressed="true"] { background: #222; color: #fff; }
        #count { margin-left: auto; color: #888; font-size: .875rem; }
        #empty { color: #888; }
        footer { margin-top: 1.5rem; color: #888; font-size: .8rem; text-align: right; }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <form id="todo-form">
        <input type="text" id="title" placeholder="제목 (예: 20231234)" required>
        <input type="text" id="description" placeholder="설명 (예: 홍길동)">
        <button type="submit">Add To-Do</button>
    </form>
    <div id="filters" role="group" aria-label="To-Do 필터">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="active" aria-pressed="false">미완료</button>
        <button type="button" data-filter="completed" aria-pressed="false">완료</button>
        <span id="count"></span>
    </div>
    <p id="error" role="alert" hidden></p>
    <ul id="todo-list"></ul>
    <p id="empty" hidden>표시할 To-Do가 없습니다.</p>
    <footer>Version 2.0.0</footer>
    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error"), countEl = $("count"), emptyEl = $("empty");

        let todos = [];                 // 서버에서 받아 둔 전체 목록
        let filter = "all";             // all | active | completed

        // 모든 요청을 한 곳에서 처리하고, 실패는 조용히 넘기지 않는다
        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        // 작업을 실행하고, 실패하면 화면에 이유를 띄운다
        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        const load = () => run("목록 불러오기", async () => { todos = await api("/todos"); render(); });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

        function button(label, onclick) {
          return Object.assign(document.createElement("button"), { textContent: label, onclick });
        }

        // 현재 필터에 해당하는 항목만 고른다 (서버 데이터는 그대로 둔다)
        const visible = () => todos.filter((todo) =>
          filter === "all" || (filter === "completed" ? todo.completed : !todo.completed));

        function render() {
          const shown = visible();
          countEl.textContent = `${shown.length} / 전체 ${todos.length}개`;
          emptyEl.hidden = shown.length > 0;
          listEl.replaceChildren(...shown.map((todo) => {
            const check = Object.assign(document.createElement("input"), {
              type: "checkbox",
              checked: todo.completed,
              onchange: () => save(todo.id, { ...todo, completed: check.checked }),
            });
            const text = Object.assign(document.createElement("span"), {
              textContent: `${todo.title} — ${todo.description}`,
              className: todo.completed ? "done" : "",
            });
            const li = document.createElement("li");
            li.append(check, text, button("Edit", () => edit(todo)), button("Delete", () => remove(todo.id)));
            return li;
          }));
        }

        function edit(todo) {
          const title = prompt("새 제목:", todo.title);
          if (title === null) return;
          const description = prompt("새 설명:", todo.description);
          if (description === null) return;
          save(todo.id, { ...todo, title: title.trim(), description: description.trim() });
        }

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
        }

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();
          run("추가", async () => {
            await api("/todos", "POST", { title: $("title").value.trim(), description: $("description").value.trim() });
            event.target.reset();
            await load();
          });
        };

        for (const btn of $("filters").querySelectorAll("button[data-filter]")) {
          btn.onclick = () => {
            filter = btn.dataset.filter;
            for (const other of $("filters").querySelectorAll("button[data-filter]")) {
              other.setAttribute("aria-pressed", String(other === btn));
            }
            render();
          };
        }

        load();
    </script>
</body>
</html>
