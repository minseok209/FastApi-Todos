# Jenkins가 fastapi-app 폴더 안에서 sonar-scanner를 실행하므로 이 파일도 fastapi-app/ 에 둔다.
# (경로는 모두 fastapi-app/ 기준)

# 프로젝트 식별자 (SonarQube에서 프로젝트를 구분하는 고유 키)
sonar.projectKey=fastapi_app
# SonarQube 대시보드에 표시될 프로젝트 이름
sonar.projectName=FastAPI App
# 프로젝트 버전 정보
sonar.projectVersion=1.0

# 분석할 소스 코드 경로 (앱 코드) / 테스트 코드 경로
# 테스트를 소스로 분석하면 test_main.py가 "커버리지 0% 코드"로 잡혀 커버리지가 낮게 나오므로 따로 지정한다
sonar.sources=.
sonar.tests=tests
sonar.python.version=3.13

# SonarQube 서버 URL (Jenkins에서 실행할 때는 withSonarQubeEnv가 등록된 URL로 덮어씀)
sonar.host.url=http://localhost:9000
# 토큰(sonar.token)은 이 파일에 절대 적지 않음 - GitHub에 올라가면 그대로 유출됨 (Jenkins Credentials로만 관리)

# 테스트 커버리지 리포트 경로 (pytest-cov가 생성한 Cobertura XML)
sonar.python.coverage.reportPaths=coverage.xml

# 분석에서 제외할 파일 패턴
# - JS, CSS, HTML은 백엔드 분석 대상이 아니므로 제외
# - coverage.xml은 소스가 아니라 테스트 결과물이므로 제외
# - tests/** 는 sonar.tests 로 따로 분석하므로 소스에서 제외 (두 번 색인되면 오류)
# - 로컬 가상환경(myenv, venv)은 외부 라이브러리이므로 제외
sonar.exclusions=**/*.js,**/*.css,**/*.html,**/coverage.xml,tests/**,myenv/**,venv/**
